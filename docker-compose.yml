services:
  mongodb:
    image: mongo:7
    container_name: tfm_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-tfmuser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-tfmpass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-energia}
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:1.0
    container_name: tfm_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-tfmuser}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-tfmpass}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-tfmuser}:${MONGO_PASSWORD:-tfmpass}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    depends_on:
      - mongodb

  streamsets:
    # Imagen propia: la oficial no incluye el destino de MongoDB.
    # Ver streamsets/Dockerfile.
    build:
      context: ./streamsets
    image: tfm/streamsets-datacollector:5.7.0-mongodb
    container_name: tfm_streamsets
    restart: unless-stopped
    ports:
      - "18630:18630"
    volumes:
      - streamsets_data:/data
      # Eventos que emiten los gateways IoT. En solo lectura: el pipeline los
      # consume, nunca los modifica.
      - ./data/stream:/tfm/stream:ro
      # Rama de rechazo del pipeline. Se escribe en un directorio propio para
      # no mezclarla con la que genera la ingesta de Python y poder comparar
      # los resultados de ambas implementaciones.
      - ./data/stream_rechazados_sdc:/tfm/rechazados
      # Pipelines exportados, para versionarlos en el repositorio
      - ./streamsets:/tfm/pipelines
    depends_on:
      - mongodb

volumes:
  mongodb_data:
  streamsets_data:
